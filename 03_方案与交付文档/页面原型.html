<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面原型 · 智慧校园综合管理平台</title>
<style>
:root{
  --ink:#2b3140; --sub:#6b7488; --line:#c8cedb; --line2:#e2e6ee;
  --fill:#eef1f7; --fill2:#f7f9fc; --paper:#fff; --accent:#4a5a78;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:#e9edf4; color:var(--ink);
  font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- 外层：说明与导航 ---------- */
.wrap{max-width:1560px;margin:0 auto;padding:20px 24px 48px}
.head{display:flex;align-items:flex-end;gap:18px;margin-bottom:16px;flex-wrap:wrap}
.head h1{font-size:19px;letter-spacing:-.01em;margin-bottom:3px}
.head p{font-size:12.5px;color:var(--sub);max-width:760px}
.legend{margin-left:auto;display:flex;gap:16px;font-size:11.5px;color:var(--sub);padding-bottom:3px}
.legend i{display:inline-block;width:22px;height:0;border-top:1px solid var(--line);vertical-align:3px;margin-right:5px}
.legend i.dash{border-top-style:dashed}

.layout{display:flex;gap:18px;align-items:flex-start}
.nav{
  width:212px;flex:0 0 212px;background:#fff;border:1px solid var(--line2);
  border-radius:6px;padding:8px;position:sticky;top:16px;
}
.nav .g{font-size:10.5px;color:#9aa3b5;letter-spacing:.08em;padding:9px 8px 3px}
.nav button{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;
  background:none;padding:6px 8px;border-radius:4px;font-size:12.5px;color:#3c4557;
}
.nav button:hover{background:#f2f5fa}
.nav button.on{background:#eef1f7;font-weight:600}
.nav button em{margin-left:auto;font-style:normal;font-size:10.5px;color:#9aa3b5;font-variant-numeric:tabular-nums}
.stage{flex:1;min-width:0;overflow-x:auto;padding-bottom:8px}
.stagebar{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--sub);margin-bottom:8px}
.stagebar .sp{margin-left:auto;display:flex;gap:8px}
.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px;background:#eef1f7;padding:1px 6px;border-radius:3px;color:#4a5a78}

/* ---------- 线框图通用元件 ---------- */
.screen{
  width:1180px;display:flex;background:var(--paper);border:1px solid var(--line);
  border-radius:6px;overflow:hidden;min-height:600px;
}
.side{width:196px;flex:0 0 196px;background:#39414f;color:#d5dbe7;display:flex;flex-direction:column}
.side .logo{display:flex;align-items:center;gap:9px;padding:15px 14px;border-bottom:1px solid rgba(255,255,255,.09)}
.side .logo .dot{width:26px;height:26px;border-radius:6px;background:#65728c;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;flex:0 0 26px}
.side .logo b{display:block;font-size:12.5px;color:#fff;letter-spacing:.02em}
.side .logo em{display:block;font-style:normal;font-size:10px;color:#8b96ab;margin-top:1px}
.side .grp{padding:13px 14px 3px;font-size:10px;color:#818da4;letter-spacing:.09em}
.side .mi{display:flex;align-items:center;gap:8px;padding:6px 14px;font-size:12px;color:#c2cad9}
.side .mi i{width:5px;height:5px;border-radius:1px;background:currentColor;opacity:.4;flex:0 0 5px}
.side .mi.on{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 2px 0 0 #9fb0d0}
.side .mi.on i{opacity:.9}
.side .side-role{margin-top:auto;padding:10px 14px;font-size:10.5px;color:#8b96ab;border-top:1px solid rgba(255,255,255,.09)}

.main{flex:1;min-width:0;display:flex;flex-direction:column;background:#f6f8fc}
.topbar{height:48px;flex:0 0 48px;background:#fff;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:12px;padding:0 16px}
.topbar .fold{color:#8a93a6;font-size:14px;letter-spacing:-1px}
.topbar .crumb{font-size:12px;color:var(--sub)}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.topbar .bell{font-size:11.5px;color:var(--sub)}
.avatar{width:24px;height:24px;border-radius:50%;background:#dde3ee;display:grid;place-items:center;font-size:11px;color:#4a5a78}

.content{padding:15px 18px 22px;overflow:auto}

.ph{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.ph h2{font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.ph .desc{font-size:11.5px;color:var(--sub);margin:3px 0 6px;max-width:720px}
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:3px}
.chips .k{font-size:10.5px;color:#9aa3b5;margin-right:1px}
.chip{font-size:10.5px;padding:1px 7px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#5a6478}
.chip.opt{border-style:dashed;color:#8a93a6}
.ph .acts{margin-left:auto;display:flex;gap:7px;flex:0 0 auto}

.btn{height:28px;padding:0 11px;border:1px solid var(--line);background:#fff;border-radius:3px;font-size:12px;color:#3c4557;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{height:22px;padding:0 7px;font-size:11px;border-radius:2px}
.btn.full{width:100%;height:32px}
.panel{border:1px solid var(--line2);background:#fff;border-radius:4px;margin-bottom:13px}
.panel>.hd{height:35px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line2);font-size:12.5px;font-weight:600}
.panel>.hd .tip{font-weight:400;font-size:11px;color:#98a1b3}
.panel>.hd .r{margin-left:auto;display:flex;gap:7px}
.panel>.bd{padding:12px}
.panel.flush>.bd{padding:0}

table.wt{width:100%;border-collapse:collapse;font-size:11.5px}
.wt th{background:#f0f3f9;font-weight:500;color:#5a6478;text-align:left;padding:7px 9px;border:1px solid var(--line2);white-space:nowrap}
.wt td{padding:7px 9px;border:1px solid var(--line2);color:#3c4557;vertical-align:middle}
.wt tr:nth-child(even) td{background:#fbfcfe}
.wt .muted{color:#9aa3b5}
.wt .num{text-align:right;font-variant-numeric:tabular-nums}

.ipt{height:28px;border:1px solid var(--line);border-radius:3px;background:#fff;display:inline-flex;align-items:center;padding:0 8px;font-size:11.5px;color:#a5adbe;min-width:118px}
.ipt.wide{min-width:180px}
.ipt.full{display:flex;width:100%;margin-bottom:8px}
.filters{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.filters .lb{font-size:11.5px;color:var(--sub)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:13px}
.stat{border:1px solid var(--line2);background:#fff;border-radius:4px;padding:10px 13px}
.stat .lb{font-size:11.5px;color:var(--sub)}
.stat .v{font-size:21px;font-weight:600;letter-spacing:-.02em;margin:1px 0;font-variant-numeric:tabular-nums}
.stat .ft{font-size:10.5px;color:#9aa3b5}

.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:13px}
.chart{height:148px;border:1px dashed var(--line);border-radius:3px;display:flex;align-items:flex-end;gap:12px;padding:18px 16px 10px;background:#fbfcfe}
.chart .bar{flex:1;background:#e2e7f0;border:1px solid #c6cddb;border-radius:2px 2px 0 0;position:relative}
.chart .bar span{position:absolute;top:-15px;left:0;right:0;text-align:center;font-size:10px;color:#8a93a6;font-variant-numeric:tabular-nums}
.chart .bar em{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-style:normal;font-size:9.5px;color:#9aa3b5;white-space:nowrap}

.prog{display:flex;align-items:center;gap:6px}
.prog .bar{width:64px;height:5px;background:#e6eaf2;border-radius:3px;overflow:hidden;flex:0 0 64px}
.prog .bar i{display:block;height:100%;background:#8f9bb3}
.prog span{font-size:10.5px;color:#7c8598;font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line2);margin-bottom:12px;font-size:12px}
.tabs .t{padding-bottom:7px;color:var(--sub)}
.tabs .t.on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--accent);margin-bottom:-1px}

.tag{font-size:10.5px;padding:1px 6px;border-radius:2px;border:1px solid var(--line);background:#f2f4f9;color:#5a6478;white-space:nowrap}
.tag.ok{background:#eaf3ec;border-color:#cfe3d3;color:#3f6b4b}
.tag.warn{background:#fdf3e3;border-color:#f0ddba;color:#8a6526}
.tag.bad{background:#fbeaea;border-color:#efcaca;color:#8a3b3b}
.tag.plain{background:#fff}

.row{display:flex;gap:12px}
.col{flex:1;min-width:0}
.note{font-size:11px;color:#8a93a6;line-height:1.7}
.note b{color:#5a6478;font-weight:600}
hr.sep{border:0;border-top:1px dashed var(--line2);margin:12px 0}

.f{display:flex;align-items:flex-start;gap:8px;margin-bottom:9px}
.f .lb{flex:0 0 74px;text-align:right;font-size:11.5px;color:var(--sub);padding-top:6px}
.f .ctl{flex:1;min-width:0}
.f .ctl .ipt{width:100%;min-width:0}
.ta{height:58px;border:1px solid var(--line);border-radius:3px;background:#fff;padding:7px 8px;font-size:11.5px;color:#a5adbe}

.cb{width:12px;height:12px;border:1px solid var(--line);border-radius:2px;display:inline-block;background:#fff;vertical-align:-2px}
.cb.on{background:#6d7b96;border-color:#6d7b96;position:relative}
.cb.on:after{content:"";position:absolute;left:3px;top:1px;width:4px;height:7px;border:1.5px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}
.rb{width:12px;height:12px;border:1px solid var(--line);border-radius:50%;display:inline-block;background:#fff;vertical-align:-2px}
.rb.on{border-color:#6d7b96;position:relative}
.rb.on:after{content:"";position:absolute;inset:3px;border-radius:50%;background:#6d7b96}

.dialog{position:relative;border:1px solid var(--line);background:#fff;border-radius:4px;padding:16px;margin:14px 0 4px}
.dialog:before{content:"弹窗 · " attr(data-t);position:absolute;top:-9px;left:10px;background:#f6f8fc;padding:0 6px;font-size:10px;color:#8a93a6}
.dialog .dh{font-size:12.5px;font-weight:600;margin-bottom:11px;display:flex}
.dialog .dh .x{margin-left:auto;color:#b3bac9;font-weight:400}

.sub-block{position:relative;border:1px dashed var(--line);border-radius:4px;padding:16px 12px 10px;margin-top:14px}
.sub-block:before{content:attr(data-t);position:absolute;top:-9px;left:10px;background:#f6f8fc;padding:0 6px;font-size:10px;color:#8a93a6}

.tt{display:grid;grid-template-columns:56px repeat(5,1fr);gap:3px;font-size:10.5px}
.tt .h{background:#f0f3f9;border:1px solid var(--line2);padding:5px 4px;text-align:center;color:#5a6478}
.tt .c{border:1px solid var(--line2);padding:5px 6px;min-height:42px;background:#fff}
.tt .c.fill{background:#eaeef6;border-color:#c6cddb}
.tt .c b{display:block;font-size:10.5px;font-weight:600;color:#3c4557}
.tt .c span{display:block;color:#8a93a6;font-size:9.5px;margin-top:1px}

.list{border:1px solid var(--line2);border-radius:3px}
.list .it{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line2);font-size:11.5px}
.list .it:last-child{border-bottom:0}
.list .it .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .it .t{font-size:10.5px;color:#9aa3b5}

.pager{display:flex;align-items:center;gap:6px;padding:9px 12px;font-size:11px;color:#8a93a6}
.pager .sp{margin-left:auto;display:flex;gap:4px}
.pager .pg{min-width:22px;height:22px;border:1px solid var(--line);border-radius:2px;display:grid;place-items:center;background:#fff;font-size:11px}
.pager .pg.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* 登录页 */
.login{min-height:620px}
.lg-brand{flex:1;background:#39414f;color:#e6eaf2;padding:56px 52px;display:flex;flex-direction:column}
.lg-brand .badge{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.12em;color:#aab5c8;border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:3px 10px;align-self:flex-start}
.lg-brand h1{font-size:34px;line-height:1.28;margin:22px 0 14px;letter-spacing:-.01em}
.lg-brand p{font-size:12.5px;line-height:1.95;color:#aab4c6;max-width:330px}
.lg-nums{display:flex;gap:30px;margin-top:28px}
.lg-nums div{font-size:10.5px;color:#94a0b5}
.lg-nums b{display:block;font-size:22px;color:#fff;font-weight:600;letter-spacing:-.02em}
.lg-foot{margin-top:auto;font-size:10.5px;color:#7f8ba1;padding-top:36px}
.lg-panel{width:404px;flex:0 0 404px;background:#fff;padding:40px 36px}
.lg-panel h2{font-size:18px}
.lg-panel .sub{font-size:11px;color:#8a93a6;margin:5px 0 16px}
.roles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:16px}
.role{border:1px solid var(--line2);border-radius:3px;padding:7px 8px}
.role.on{border-color:#6d7b96;background:#eef1f7}
.role b{display:block;font-size:11px;font-weight:600}
.role span{display:block;font-size:9.5px;color:#9aa3b5;margin-top:1px}
.cap{display:flex;gap:8px;margin-bottom:12px}
.cap .ipt{flex:1}
.capbox{width:84px;flex:0 0 84px;height:28px;border:1px solid var(--line);border-radius:3px;background:#eef1f7;display:grid;place-items:center;font-size:12px;letter-spacing:.22em;color:#5a6478}
.lg-panel .tip{font-size:10px;color:#9aa3b5;line-height:1.75;margin-top:14px;border-top:1px dashed var(--line2);padding-top:11px}

@media print{
  body{background:#fff}
  .nav,.head .legend,.stagebar .sp{display:none}
  .wrap{padding:0;max-width:none}
  .stage{overflow:visible}
  .screen{width:100%;border:0;border-radius:0;page-break-after:always;break-after:page}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div>
      <h1>页面原型 · 智慧校园综合管理平台</h1>
      <p>低保真线框图，对应 <span class="code">02_程序源码/frontend/js/pages</span> 下的 13 个页面文件。表格里的数据取自 <span class="code">seed.js</span>，与运行起来的界面一致。左侧按菜单分组，点开逐页看。</p>
    </div>
    <div class="legend">
      <span><i></i>实线：已实现</span>
      <span><i class="dash"></i>虚线：选做或未展开</span>
    </div>
  </header>
  <div class="layout">
    <nav class="nav" id="nav"></nav>
    <div class="stage">
      <div class="stagebar">
        <span id="sb-title"></span>
        <span class="code" id="sb-file"></span>
        <span class="sp">
          <button class="btn sm" id="btn-all">全部展开</button>
          <button class="btn sm" id="btn-print">打印 / 存 PDF</button>
        </span>
      </div>
      <div id="out"></div>
    </div>
  </div>
</div>

<script>
var ROLE_NAME={admin:'系统管理员',academic:'教务管理员',counselor:'辅导员',teacher:'教师',student:'学生',librarian:'图书管理员'};
var AVATAR={admin:'张',academic:'李',counselor:'王',teacher:'陈',student:'赵',librarian:'王'};

var MENU=[
  {g:'总览',items:[
    {p:'/dashboard',t:'数据总览',r:['admin','academic','counselor']}
  ]},
  {g:'教务管理',items:[
    {p:'/students',t:'学生信息管理',r:['admin','academic','counselor']},
    {p:'/courses',t:'课程与排课',r:['admin','academic','teacher']},
    {p:'/course-selection',t:'选课管理',r:['admin','academic','student']},
    {p:'/grades',t:'成绩管理',r:['admin','academic','teacher','student']},
    {p:'/exams',t:'考试与考务',r:['admin','academic','teacher']}
  ]},
  {g:'学生事务',items:[
    {p:'/student-affairs',t:'学工与请假',r:['admin','academic','counselor']},
    {p:'/teacher/workbench',t:'教师工作台',r:['admin','teacher']},
    {p:'/student/portal',t:'学生端门户',r:['admin','student']}
  ]},
  {g:'校园服务',items:[
    {p:'/campus/library',t:'图书借阅',r:['admin','librarian','teacher','student']},
    {p:'/campus/venue',t:'场地预约',r:['admin','librarian','teacher','student','academic','counselor']}
  ]},
  {g:'消息',items:[
    {p:'/message/center',t:'消息中心',r:['admin','academic','counselor','teacher','student','librarian']}
  ]}
];

function shell(page,inner){
  var groups=MENU.map(function(g){
    return {g:g.g,items:g.items.filter(function(i){return i.r.indexOf(page.role)>-1;})};
  }).filter(function(g){return g.items.length;});
  var menu=groups.map(function(g){
    return '<div class="grp">'+g.g+'</div>'+g.items.map(function(i){
      return '<div class="mi'+(i.p===page.path?' on':'')+'"><i></i>'+i.t+'</div>';
    }).join('');
  }).join('');
  return '<div class="screen">'
    +'<aside class="side">'
    +'<div class="logo"><span class="dot">智</span><div><b>智慧校园</b><em>综合管理平台</em></div></div>'
    +menu
    +'<div class="side-role">当前视角：'+ROLE_NAME[page.role]+'</div>'
    +'</aside>'
    +'<div class="main">'
    +'<div class="topbar"><span class="fold">≡</span><span class="crumb">首页 / '+page.title+'</span>'
    +'<span class="right"><span class="tag">接口模式</span><span class="bell">消息 · 3</span><span class="avatar">'+AVATAR[page.role]+'</span></span></div>'
    +'<div class="content">'+inner+'</div>'
    +'</div></div>';
}

var PAGES=[
{
  key:'login',group:'登录',no:'00',title:'登录页',owner:'公共',role:'student',path:'/login',
  file:'js/pages/login.js',route:'/login',
  body:''
  +'<div class="screen login">'
  +'<div class="lg-brand">'
    +'<div class="badge">SMART CAMPUS</div>'
    +'<h1>智慧校园<br>综合管理平台</h1>'
    +'<p>覆盖学籍、排课、选课、成绩、考务、学工、图书借阅与校园服务的统一管理平台。六种角色，一套权限体系，一份数据贯穿教务主线。</p>'
    +'<div class="lg-nums"><div><b>13</b>个核心页面</div><div><b>6</b>种角色权限</div><div><b>1.5</b>周迭代交付</div></div>'
    +'<div class="lg-foot">前端全栈课程综合实训 · 项目三 · Vue2 + Element UI + ECharts</div>'
  +'</div>'
  +'<div class="lg-panel">'
    +'<h2>账号登录</h2>'
    +'<p class="sub">请选择角色并输入账号密码，不同角色看到的菜单不同</p>'
    +'<div class="roles">'
      +'<div class="role"><b>系统管理员</b><span>全部权限</span></div>'
      +'<div class="role"><b>教务管理员</b><span>教务主线</span></div>'
      +'<div class="role"><b>辅导员</b><span>学工审批</span></div>'
      +'<div class="role"><b>教师</b><span>教学与成绩</span></div>'
      +'<div class="role on"><b>学生</b><span>选课与查询</span></div>'
      +'<div class="role"><b>图书管理员</b><span>借还与场馆</span></div>'
    +'</div>'
    +'<div class="ipt full">账号　student</div>'
    +'<div class="ipt full">密码　••••••</div>'
    +'<div class="cap"><div class="ipt">验证码</div><div class="capbox">7K3D</div></div>'
    +'<div class="btn pri full">登 录</div>'
    +'<p class="tip">测试账号 admin / academic / counselor / teacher / student / librarian，密码统一 123456。<br>未启动后端时自动进入本地 Mock，数据存在浏览器 localStorage。</p>'
  +'</div>'
  +'</div>'
},
{
  key:'dashboard',group:'总览',no:'01',title:'数据总览页',owner:'A 组员',role:'admin',path:'/dashboard',
  file:'js/pages/dashboard.js',route:'/dashboard',

var nav=document.getElementById('nav');
var out=document.getElementById('out');
var sbTitle=document.getElementById('sb-title');
var sbFile=document.getElementById('sb-file');
var current=PAGES[0].key;
var allMode=false;

// 支持直接链接到某一页：#dashboard 或 ?p=dashboard；?all=1 直接展开全部
(function(){
  var k=(location.hash||'').replace('#','');
  try{
    var q=new URLSearchParams(location.search);
    if(!k) k=q.get('p')||'';
    if(q.get('all')==='1') allMode=true;
  }catch(e){}
  if(k && PAGES.some(function(p){return p.key===k;})) current=k;
})();

function buildNav(){
  var html='',last='';
  PAGES.forEach(function(p){
    if(p.group!==last){ html+='<div class="g">'+p.group+'</div>'; last=p.group; }
    html+='<button data-key="'+p.key+'" class="'+(p.key===current&&!allMode?'on':'')+'">'
      +'<span>'+p.title+'</span><em>'+p.no+'</em></button>';
  });
  nav.innerHTML=html;
}

function render(){
  document.getElementById('btn-all').textContent=allMode?'单页查看':'全部展开';
  if(allMode){
    sbTitle.textContent='全部 '+PAGES.length+' 屏';
    sbFile.textContent='打印时建议先点「全部展开」';
    out.innerHTML=PAGES.map(function(p){
      return '<div style="margin-bottom:30px">'
        +'<div style="font-size:12px;color:#6b7488;margin-bottom:7px">'+p.title+' · '+p.owner+'　<span class="code">'+p.file+'</span></div>'
        +p.body+'</div>';
    }).join('');
  }else{
    var page=PAGES.filter(function(p){return p.key===current;})[0];
    sbTitle.textContent=page.title+' · '+page.owner;
    sbFile.textContent=page.file;
    out.innerHTML=page.body;
  }
  buildNav();
}

nav.addEventListener('click',function(e){
  var btn=e.target.closest('button');
  if(!btn) return;
  current=btn.getAttribute('data-key');
  allMode=false;
  if(history.replaceState) history.replaceState(null,'','#'+current);
  render();
  window.scrollTo({top:0,behavior:'smooth'});
});

document.getElementById('btn-all').addEventListener('click',function(){
  allMode=!allMode;
  render();
});

document.getElementById('btn-print').addEventListener('click',function(){
  if(!allMode){ allMode=true; render(); }
  window.print();
});

render();
</script>
</body>
</html>
